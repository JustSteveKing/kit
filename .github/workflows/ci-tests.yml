name: ci-tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          tools: composer:v2
          extensions: mbstring, dom, curl, sqlite3, pdo_sqlite
          coverage: none

      # Before install: Composer's post-autoload-dump boots the app, which without a .env runs as
      # production and fails ProductionSecurityChecks.
      - name: Prepare environment
        run: cp .env.example .env

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Generate app key
        run: php artisan key:generate

      - name: Check code style
        run: composer lint

      - name: Check Rector has nothing to change
        run: composer rector:check

      - name: Run static analysis
        run: composer stan

      - name: Run test suite
        run: php artisan test

      # The test suite regenerates public/docs/openapi.yaml, so this grades the spec the code
      # produces now, against .legible.yaml.
      - name: Check the OpenAPI spec is agent-ready
        env:
          LEGIBLE_VERSION: 0.1.2
        run: |
          archive="legible_${LEGIBLE_VERSION}_linux_amd64.tar.gz"
          base="https://github.com/JustSteveKing/legible/releases/download/v${LEGIBLE_VERSION}"
          curl -fsSLO "${base}/${archive}"
          curl -fsSL "${base}/checksums.txt" | grep " ${archive}\$" | sha256sum -c -
          tar xzf "${archive}" legible
          ./legible check public/docs/openapi.yaml

  image:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build the production image
        run: docker build --tag kit:ci .

      # Boots with production settings, so ProductionSecurityChecks runs, then asks Octane for a
      # health check and an API problem through a TLS-terminating proxy's headers.
      - name: Boot it and make requests
        run: |
          docker run --detach --name kit --publish 8000:8000 \
            --env APP_KEY="base64:$(openssl rand -base64 32)" \
            --env APP_URL=https://api.example.test \
            --env SECURITY_FORCE_HTTPS=true \
            --env TRUSTED_HOSTS=api.example.test \
            --env CORS_ALLOWED_ORIGINS=https://app.example.test \
            --env DB_CONNECTION=sqlite \
            --env DB_DATABASE=/tmp/kit.sqlite \
            kit:ci
          for attempt in $(seq 1 30); do
            curl --silent --fail --header 'Host: api.example.test' --header 'X-Forwarded-Proto: https' \
              http://127.0.0.1:8000/up > /dev/null && break
            sleep 1
          done
          curl --silent --fail --header 'Host: api.example.test' --header 'X-Forwarded-Proto: https' \
            http://127.0.0.1:8000/up > /dev/null
          curl --silent --include --header 'Host: api.example.test' --header 'X-Forwarded-Proto: https' \
            http://127.0.0.1:8000/v1/auth/me | tee response.txt
          grep --quiet '^HTTP/1.1 401' response.txt
          grep --quiet --ignore-case '^content-type: application/problem+json' response.txt
          # Under Octane each request is served from a sandbox; the problem must name this request.
          request_id=$(grep --ignore-case '^x-request-id:' response.txt | cut -d' ' -f2 | tr -d '\r')
          grep --quiet "\"instance\":\"urn:uuid:${request_id}\"" response.txt

      - name: Show the container log
        if: failure()
        run: docker logs kit
