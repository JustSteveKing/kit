name: ci-tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          tools: composer:v2
          extensions: mbstring, dom, curl, sqlite3, pdo_sqlite
          coverage: none

      # Before install: Composer's post-autoload-dump boots the app, which without a .env runs as
      # production and fails ProductionSecurityChecks.
      - name: Prepare environment
        run: cp .env.example .env

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Generate app key
        run: php artisan key:generate

      - name: Check code style
        run: composer lint

      - name: Run static analysis
        run: composer stan

      - name: Run test suite
        run: php artisan test

      # The test suite regenerates public/docs/openapi.yaml, so this grades the spec the code
      # produces now, against .legible.yaml.
      - name: Check the OpenAPI spec is agent-ready
        env:
          LEGIBLE_VERSION: 0.1.2
        run: |
          archive="legible_${LEGIBLE_VERSION}_linux_amd64.tar.gz"
          base="https://github.com/JustSteveKing/legible/releases/download/v${LEGIBLE_VERSION}"
          curl -fsSLO "${base}/${archive}"
          curl -fsSL "${base}/checksums.txt" | grep " ${archive}\$" | sha256sum -c -
          tar xzf "${archive}" legible
          ./legible check public/docs/openapi.yaml
