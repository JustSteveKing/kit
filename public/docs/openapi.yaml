openapi: 3.0.3
info:
  title: 'Laravel API Documentation'
  description: ''
  version: 1.0.0
servers:
  -
    url: 'http://localhost'
tags:
  -
    name: Authentication
    description: ''
  -
    name: Webhooks
    description: ''
components:
  securitySchemes:
    default:
      type: http
      scheme: bearer
      description: 'Get a bearer token from the `POST /v1/auth/login` endpoint.'
security:
  -
    default: []
paths:
  /v1/auth/register:
    post:
      summary: Register
      operationId: register
      description: 'Create an account and issue its first bearer token. Use it once per new user; send an Idempotency-Key so a retried request cannot create a second account. Returns the user with the token, its type and expiry in meta, and sends a verification email.'
      parameters: []
      responses:
        201:
          description: 'Registration succeeded.'
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    id: 01m5cjb70r9fgm3p1vsa3t5kbd
                    name: 'Justina Gaylord'
                    email: lafayette.considine@example.com
                    email_verified_at: '2026-10-20T11:49:59+00:00'
                    created_at: null
                    updated_at: null
                  meta:
                    token: 1|example-token
                    token_type: Bearer
                    expires_at: null
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                        example: 01m5cjb70r9fgm3p1vsa3t5kbd
                      name:
                        type: string
                        example: 'Justina Gaylord'
                      email:
                        type: string
                        example: lafayette.considine@example.com
                      email_verified_at:
                        type: string
                        example: '2026-10-20T11:49:59+00:00'
                      created_at:
                        type: string
                        example: null
                        nullable: true
                      updated_at:
                        type: string
                        example: null
                        nullable: true
                  meta:
                    type: object
                    properties:
                      token:
                        type: string
                        example: 1|example-token
                      token_type:
                        type: string
                        example: Bearer
                      expires_at:
                        type: string
                        example: null
                        nullable: true
        422:
          description: 'Validation failed.'
          content:
            application/problem+json:
              schema:
                type: object
                example:
                  type: 'https://apiguide.dev/errors/validation-failed'
                  title: 'Validation Failed'
                  status: 422
                  detail: 'The email has already been taken.'
                  errors:
                    email:
                      - 'The email has already been taken.'
                properties:
                  type:
                    type: string
                    example: 'https://apiguide.dev/errors/validation-failed'
                  title:
                    type: string
                    example: 'Validation Failed'
                  status:
                    type: integer
                    example: 422
                  detail:
                    type: string
                    example: 'The email has already been taken.'
                  errors:
                    type: object
                    properties:
                      email:
                        type: array
                        example:
                          - 'The email has already been taken.'
                        items:
                          type: string
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: 'Display name for the account.'
                  example: 'Jane Doe'
                email:
                  type: string
                  description: 'Unique email address for login.'
                  example: jane@example.com
                password:
                  type: string
                  description: 'Account password.'
                  example: password123
                device_name:
                  type: string
                  description: 'Client device label for token tracking.'
                  example: ios-app
              required:
                - name
                - email
                - password
      security: []
  /v1/auth/login:
    post:
      summary: Login
      operationId: login
      description: 'Exchange an email and password for a bearer token. Use it when a user signs in on a new device, naming the device in device_name. Returns the user with the token, its type and expiry in meta; wrong credentials are a 422 on the email field.'
      parameters: []
      responses:
        200:
          description: 'Login succeeded.'
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    id: 01m5cjb75mxp8226rd0k5yd7gz
                    name: 'Justina Gaylord'
                    email: cormier.nick@example.com
                    email_verified_at: '2026-10-20T11:49:59+00:00'
                    created_at: null
                    updated_at: null
                  meta:
                    token: 1|example-token
                    token_type: Bearer
                    expires_at: null
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                        example: 01m5cjb75mxp8226rd0k5yd7gz
                      name:
                        type: string
                        example: 'Justina Gaylord'
                      email:
                        type: string
                        example: cormier.nick@example.com
                      email_verified_at:
                        type: string
                        example: '2026-10-20T11:49:59+00:00'
                      created_at:
                        type: string
                        example: null
                        nullable: true
                      updated_at:
                        type: string
                        example: null
                        nullable: true
                  meta:
                    type: object
                    properties:
                      token:
                        type: string
                        example: 1|example-token
                      token_type:
                        type: string
                        example: Bearer
                      expires_at:
                        type: string
                        example: null
                        nullable: true
        422:
          description: 'Credentials were invalid.'
          content:
            application/problem+json:
              schema:
                type: object
                example:
                  type: 'https://apiguide.dev/errors/validation-failed'
                  title: 'Validation Failed'
                  status: 422
                  detail: 'The provided credentials are incorrect.'
                  errors:
                    email:
                      - 'The provided credentials are incorrect.'
                properties:
                  type:
                    type: string
                    example: 'https://apiguide.dev/errors/validation-failed'
                  title:
                    type: string
                    example: 'Validation Failed'
                  status:
                    type: integer
                    example: 422
                  detail:
                    type: string
                    example: 'The provided credentials are incorrect.'
                  errors:
                    type: object
                    properties:
                      email:
                        type: array
                        example:
                          - 'The provided credentials are incorrect.'
                        items:
                          type: string
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  description: 'User email address.'
                  example: jane@example.com
                password:
                  type: string
                  description: 'User password.'
                  example: password123
                device_name:
                  type: string
                  description: 'Client device label for token tracking.'
                  example: ios-app
              required:
                - email
                - password
                - device_name
      security: []
  /v1/auth/password/forgot:
    post:
      summary: 'Request Password Reset'
      operationId: requestPasswordReset
      description: 'Email a password reset link to an address, if an account uses it. Use it from a forgot-password form. The response is the same whether or not the account exists, so it cannot be used to discover accounts; send an Idempotency-Key so a retry does not send a second email.'
      parameters: []
      responses:
        200:
          description: 'Password reset request accepted.'
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'If the account exists, a password reset link has been sent.'
                properties:
                  message:
                    type: string
                    example: 'If the account exists, a password reset link has been sent.'
        422:
          description: 'The email was missing or not an email address.'
          content:
            application/problem+json:
              schema:
                type: object
                example:
                  type: 'https://apiguide.dev/errors/validation-failed'
                  title: 'Validation Failed'
                  status: 422
                  detail: 'The email field must be a valid email address.'
                  errors:
                    email:
                      - 'The email field must be a valid email address.'
                properties:
                  type:
                    type: string
                    example: 'https://apiguide.dev/errors/validation-failed'
                  title:
                    type: string
                    example: 'Validation Failed'
                  status:
                    type: integer
                    example: 422
                  detail:
                    type: string
                    example: 'The email field must be a valid email address.'
                  errors:
                    type: object
                    properties:
                      email:
                        type: array
                        example:
                          - 'The email field must be a valid email address.'
                        items:
                          type: string
        429:
          description: 'Too many reset requests for this address; retry after the Retry-After header.'
          content:
            application/problem+json:
              schema:
                type: object
                example:
                  type: 'https://apiguide.dev/errors/rate-limit-exceeded'
                  title: 'Rate Limit Exceeded'
                  status: 429
                  detail: 'Too many requests. Please try again later.'
                properties:
                  type:
                    type: string
                    example: 'https://apiguide.dev/errors/rate-limit-exceeded'
                  title:
                    type: string
                    example: 'Rate Limit Exceeded'
                  status:
                    type: integer
                    example: 429
                  detail:
                    type: string
                    example: 'Too many requests. Please try again later.'
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  description: 'Account email address.'
                  example: jane@example.com
              required:
                - email
      security: []
  /v1/auth/password/reset:
    post:
      summary: 'Reset Password'
      operationId: resetPassword
      description: 'Set a new password using the token from a password reset email. Use it to finish the forgot-password flow. Returns a confirmation message; an invalid or expired token is a 422 on the email field.'
      parameters: []
      responses:
        200:
          description: 'Password reset succeeded.'
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Your password has been reset.'
                properties:
                  message:
                    type: string
                    example: 'Your password has been reset.'
        422:
          description: 'Reset token or payload was invalid.'
          content:
            application/problem+json:
              schema:
                type: object
                example:
                  type: 'https://apiguide.dev/errors/validation-failed'
                  title: 'Validation Failed'
                  status: 422
                  detail: 'This password reset token is invalid.'
                  errors:
                    email:
                      - 'This password reset token is invalid.'
                properties:
                  type:
                    type: string
                    example: 'https://apiguide.dev/errors/validation-failed'
                  title:
                    type: string
                    example: 'Validation Failed'
                  status:
                    type: integer
                    example: 422
                  detail:
                    type: string
                    example: 'This password reset token is invalid.'
                  errors:
                    type: object
                    properties:
                      email:
                        type: array
                        example:
                          - 'This password reset token is invalid.'
                        items:
                          type: string
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                token:
                  type: string
                  description: 'Password reset token.'
                  example: reset-token-value
                email:
                  type: string
                  description: 'Account email associated with token.'
                  example: jane@example.com
                password:
                  type: string
                  description: 'New account password.'
                  example: new-password123
                password_confirmation:
                  type: string
                  description: 'Must match password.'
                  example: new-password123
              required:
                - token
                - email
                - password
                - password_confirmation
      security: []
  '/v1/auth/password/reset/{token}':
    get:
      summary: 'Read Reset Token Payload'
      operationId: readResetTokenPayload
      description: 'Return the token and email from a password reset link, for a client that opens the link and shows its own reset form. It does not check the token; Reset Password does. Returns the token and the email, if the link carried one.'
      parameters:
        -
          in: query
          name: email
          description: 'Account email from the reset link.'
          example: jane@example.com
          required: false
          schema:
            type: string
            description: 'Account email from the reset link.'
            example: jane@example.com
      responses:
        200:
          description: 'Reset payload data.'
          content:
            application/json:
              schema:
                type: object
                example:
                  token: reset-token-value
                  email: jane@example.com
                properties:
                  token:
                    type: string
                    example: reset-token-value
                  email:
                    type: string
                    example: jane@example.com
        422:
          description: 'The email query parameter was not an email address.'
          content:
            application/problem+json:
              schema:
                type: object
                example:
                  type: 'https://apiguide.dev/errors/validation-failed'
                  title: 'Validation Failed'
                  status: 422
                  detail: 'The email field must be a valid email address.'
                  errors:
                    email:
                      - 'The email field must be a valid email address.'
                properties:
                  type:
                    type: string
                    example: 'https://apiguide.dev/errors/validation-failed'
                  title:
                    type: string
                    example: 'Validation Failed'
                  status:
                    type: integer
                    example: 422
                  detail:
                    type: string
                    example: 'The email field must be a valid email address.'
                  errors:
                    type: object
                    properties:
                      email:
                        type: array
                        example:
                          - 'The email field must be a valid email address.'
                        items:
                          type: string
      tags:
        - Authentication
      security: []
    parameters:
      -
        in: path
        name: token
        description: 'Password reset token from reset link.'
        example: reset-token-value
        required: true
        schema:
          type: string
  '/v1/auth/email/verify/{id}/{hash}':
    get:
      summary: 'Verify Email'
      operationId: verifyEmail
      description: "Mark the user's email as verified using the signed link from the verification email. Clients do not build this URL; they follow the one in the email, which expires. Returns a confirmation message; a link that is invalid, expired or altered is a 403."
      parameters: []
      responses:
        200:
          description: 'Email was verified.'
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Email verified successfully.'
                properties:
                  message:
                    type: string
                    example: 'Email verified successfully.'
        403:
          description: 'Signed URL was invalid, expired, or mismatched.'
          content:
            application/problem+json:
              schema:
                type: object
                example:
                  type: 'https://apiguide.dev/errors/forbidden'
                  title: Forbidden
                  status: 403
                  detail: 'Invalid verification link.'
                properties:
                  type:
                    type: string
                    example: 'https://apiguide.dev/errors/forbidden'
                  title:
                    type: string
                    example: Forbidden
                  status:
                    type: integer
                    example: 403
                  detail:
                    type: string
                    example: 'Invalid verification link.'
      tags:
        - Authentication
      security: []
    parameters:
      -
        in: path
        name: id
        description: 'User ULID from the signed verification link.'
        example: 01HZX3W3T4J8Q57XNZD5BPHJ92
        required: true
        schema:
          type: string
      -
        in: path
        name: hash
        description: 'SHA-1 hash of the email from the signed verification link.'
        example: 8c4f4370e5db9b5be6d0f4c95495f49f998fa32a
        required: true
        schema:
          type: string
  /v1/auth/me:
    get:
      summary: 'Get Current User'
      operationId: getCurrentUser
      description: "Return the user the bearer token belongs to. Use it to check a token still works and to read the account's profile and verification state. The response carries an ETag: send it back in If-None-Match and an unchanged user returns 304 with no body."
      parameters: []
      responses:
        200:
          description: 'Authenticated user profile.'
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    id: 01m5cjb7b0xwcwsjy7am2c6xm2
                    name: 'Morgan Hirthe'
                    email: dare.emelie@example.com
                    email_verified_at: '2026-10-20T11:49:59+00:00'
                    created_at: null
                    updated_at: null
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                        example: 01m5cjb7b0xwcwsjy7am2c6xm2
                      name:
                        type: string
                        example: 'Morgan Hirthe'
                      email:
                        type: string
                        example: dare.emelie@example.com
                      email_verified_at:
                        type: string
                        example: '2026-10-20T11:49:59+00:00'
                      created_at:
                        type: string
                        example: null
                        nullable: true
                      updated_at:
                        type: string
                        example: null
                        nullable: true
        401:
          description: 'Authentication failed.'
          content:
            application/problem+json:
              schema:
                type: object
                example:
                  type: 'https://apiguide.dev/errors/unauthorized'
                  title: Unauthorized
                  status: 401
                  detail: Unauthenticated.
                properties:
                  type:
                    type: string
                    example: 'https://apiguide.dev/errors/unauthorized'
                  title:
                    type: string
                    example: Unauthorized
                  status:
                    type: integer
                    example: 401
                  detail:
                    type: string
                    example: Unauthenticated.
      tags:
        - Authentication
  /v1/auth/logout:
    post:
      summary: Logout
      operationId: logout
      description: "Revoke the bearer token that made this request, and only that one. Use it when a client signs out; the user's other tokens keep working. Returns 204 with no body."
      parameters: []
      responses:
        204:
          description: 'Token revoked.'
        401:
          description: 'Authentication failed.'
          content:
            application/problem+json:
              schema:
                type: object
                example:
                  type: 'https://apiguide.dev/errors/unauthorized'
                  title: Unauthorized
                  status: 401
                  detail: Unauthenticated.
                properties:
                  type:
                    type: string
                    example: 'https://apiguide.dev/errors/unauthorized'
                  title:
                    type: string
                    example: Unauthorized
                  status:
                    type: integer
                    example: 401
                  detail:
                    type: string
                    example: Unauthenticated.
      tags:
        - Authentication
  /v1/auth/tokens:
    get:
      summary: 'List Tokens'
      operationId: listTokens
      description: 'List the authenticated user''s personal access tokens, newest first, 25 to a page. Use it to show signed-in devices or to find a token ID to revoke. Returns an array of tokens, with is_current marking the one making the request; follow the Link header''s rel="next" for the next page.'
      parameters:
        -
          in: query
          name: cursor
          description: 'Opaque cursor from a Link header. Omit it for the first page.'
          example: architecto
          required: false
          schema:
            type: string
            description: 'Opaque cursor from a Link header. Omit it for the first page.'
            example: architecto
      responses:
        200:
          description: 'One page of tokens, newest first. Navigation is in RFC 8288 Link headers: rel="next" and rel="prev" when there is a page that way, and rel="first".'
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                      example: '1'
                    name:
                      type: string
                      example: ios-app
                    abilities:
                      type: array
                      example:
                        - 'auth:me'
                        - 'auth:logout'
                      items:
                        type: string
                    last_used_at:
                      type: string
                      example: null
                      nullable: true
                    expires_at:
                      type: string
                      example: '2026-02-24T12:00:00+00:00'
                    created_at:
                      type: string
                      example: '2026-02-23T12:00:00+00:00'
                    updated_at:
                      type: string
                      example: '2026-02-23T12:00:00+00:00'
                    is_current:
                      type: boolean
                      example: true
                example:
                  -
                    id: '1'
                    name: ios-app
                    abilities:
                      - 'auth:me'
                      - 'auth:logout'
                    last_used_at: null
                    expires_at: '2026-02-24T12:00:00+00:00'
                    created_at: '2026-02-23T12:00:00+00:00'
                    updated_at: '2026-02-23T12:00:00+00:00'
                    is_current: true
        401:
          description: 'Authentication failed.'
          content:
            application/problem+json:
              schema:
                type: object
                example:
                  type: 'https://apiguide.dev/errors/unauthorized'
                  title: Unauthorized
                  status: 401
                  detail: Unauthenticated.
                properties:
                  type:
                    type: string
                    example: 'https://apiguide.dev/errors/unauthorized'
                  title:
                    type: string
                    example: Unauthorized
                  status:
                    type: integer
                    example: 401
                  detail:
                    type: string
                    example: Unauthenticated.
        403:
          description: 'Token is missing required ability.'
          content:
            application/problem+json:
              schema:
                type: object
                example:
                  type: 'https://apiguide.dev/errors/forbidden'
                  title: Forbidden
                  status: 403
                  detail: Forbidden.
                properties:
                  type:
                    type: string
                    example: 'https://apiguide.dev/errors/forbidden'
                  title:
                    type: string
                    example: Forbidden
                  status:
                    type: integer
                    example: 403
                  detail:
                    type: string
                    example: Forbidden.
      tags:
        - Authentication
    post:
      summary: 'Create API Key'
      operationId: createAPIKey
      description: 'Create a long-lived personal access token with chosen abilities, for a script, integration or agent that should not sign in with a password. It can only hold abilities the token making this request holds, and expires on expires_at, or after the configured default when that is left out. Returns the token with its plain-text value in meta.token, which is shown once and cannot be read again.'
      parameters: []
      responses:
        201:
          description: 'API key created. meta.token is the only time its value is returned.'
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    id: '7'
                    name: deploy-bot
                    abilities:
                      - 'auth:me'
                      - 'auth:tokens:read'
                    last_used_at: null
                    expires_at: '2027-01-01T00:00:00+00:00'
                    created_at: '2026-10-20T12:00:00+00:00'
                    updated_at: '2026-10-20T12:00:00+00:00'
                    is_current: false
                  meta:
                    token: 7|example-token
                    token_type: Bearer
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                        example: '7'
                      name:
                        type: string
                        example: deploy-bot
                      abilities:
                        type: array
                        example:
                          - 'auth:me'
                          - 'auth:tokens:read'
                        items:
                          type: string
                      last_used_at:
                        type: string
                        example: null
                        nullable: true
                      expires_at:
                        type: string
                        example: '2027-01-01T00:00:00+00:00'
                      created_at:
                        type: string
                        example: '2026-10-20T12:00:00+00:00'
                      updated_at:
                        type: string
                        example: '2026-10-20T12:00:00+00:00'
                      is_current:
                        type: boolean
                        example: false
                  meta:
                    type: object
                    properties:
                      token:
                        type: string
                        example: 7|example-token
                      token_type:
                        type: string
                        example: Bearer
        401:
          description: 'Authentication failed.'
          content:
            application/problem+json:
              schema:
                type: object
                example:
                  type: 'https://apiguide.dev/errors/unauthorized'
                  title: Unauthorized
                  status: 401
                  detail: Unauthenticated.
                properties:
                  type:
                    type: string
                    example: 'https://apiguide.dev/errors/unauthorized'
                  title:
                    type: string
                    example: Unauthorized
                  status:
                    type: integer
                    example: 401
                  detail:
                    type: string
                    example: Unauthenticated.
        403:
          description: 'Token is missing the auth:tokens:create ability.'
          content:
            application/problem+json:
              schema:
                type: object
                example:
                  type: 'https://apiguide.dev/errors/forbidden'
                  title: Forbidden
                  status: 403
                  detail: Forbidden.
                properties:
                  type:
                    type: string
                    example: 'https://apiguide.dev/errors/forbidden'
                  title:
                    type: string
                    example: Forbidden
                  status:
                    type: integer
                    example: 403
                  detail:
                    type: string
                    example: Forbidden.
        422:
          description: 'A requested ability is not held by this token, or the expiry is invalid.'
          content:
            application/problem+json:
              schema:
                type: object
                example:
                  type: 'https://apiguide.dev/errors/validation-failed'
                  title: 'Validation Failed'
                  status: 422
                  detail: 'You can only grant abilities your current token holds.'
                  errors:
                    abilities.0:
                      - 'You can only grant abilities your current token holds.'
                properties:
                  type:
                    type: string
                    example: 'https://apiguide.dev/errors/validation-failed'
                  title:
                    type: string
                    example: 'Validation Failed'
                  status:
                    type: integer
                    example: 422
                  detail:
                    type: string
                    example: 'You can only grant abilities your current token holds.'
                  errors:
                    type: object
                    properties:
                      abilities.0:
                        type: array
                        example:
