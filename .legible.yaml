# legible scores public/docs/openapi.yaml for agent readiness: what will trip up an LLM calling
# the API as tools. CI fails on any warning or a score under 95. `legible explain <rule>` says why a
# rule matters. https://github.com/JustSteveKing/legible
fail-on: warning
fail-under: 95

ignore:
  - rule: error-shape
    operations:
      - POST /v1/auth/register
      - POST /v1/auth/login
      - POST /v1/auth/password/forgot
      - POST /v1/auth/password/reset
      - GET /v1/auth/password/reset/*
      - POST /v1/auth/tokens
      - POST /v1/webhooks
      - PATCH /v1/webhooks/*
    reason: >
      Validation problems add an errors member keyed by field, which apiguide.dev's
      validation-failed type defines. Every problem shares type, title, status and detail.
